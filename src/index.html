<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Jump-n-Run</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div id="hud" aria-live="off">
    <div class="stat"><span class="label">Score</span><span id="score">0</span></div>
    <div class="stat"><span class="label">Best</span><span id="best">0</span></div>
  </div>

  <div id="panel">
    <h1 id="panelTitle">Jump-n-Run</h1>
    <p id="panelText">Dodge the obstacles and ride as far as you can.</p>
    <p class="hint"><kbd>Space</kbd> / <kbd>↑</kbd> / tap to jump</p>
  </div>

  <script src="gameObject.js"></script>
  <script src="cloud.js"></script>
  <script src="obstacle.js"></script>
  <script src="character.js"></script>
  <script src="game.js"></script>
  <script src="main.js"></script>
</body>
</html>
